# =============================================================================
# ADNAN ŞAHİN PATRON BULUTU — VDS /opt/adnan/patron/compose.yaml bu dosyanın birebir kopyasıdır (tek tesis, yalnız API)
# =============================================================================
# `.env` (0600, repoya GİRMEZ; PAROLA TAŞIMAZ): POSTGRES_USER (önyükleme süper kullanıcısı; yalnız kapsayıcı içi
# yerel soket — yedek) · POSTGRES_DB · PATRON_IMAJ (adnan-patron:<sha>) · ADNAN_AG_ALT_AGI (proxy/ projesinin ağı).
# Sırlar `sirlar/` altında dosya (HEPSİ root:10001 0440; db ek grup 10001 ile yalnız kendine bağlanan ikisini okur),
# hepsi yalnız harf/rakam:
#   db_kok_parolasi · goc_parolasi (göç rolü patron_goc — süper kullanıcı DEĞİL, db-init/10-goc-rolu.sh kurar) ·
#   uygulama_parolasi · esitleme_parolasi · tesis_rol_anahtari (giriş dizini = kimlik e-posta özeti HMAC anahtarı,
#   32 bayt base64url; ad eski düzenden kalır) · isteğe bağlı guvenlik_telegram_bot_token / guvenlik_telegram_chat_id.
# TOTP sarma anahtarı `anahtarlar/patron-totp.key` (10001 0600, 32 bayt base64url); birim salt okunur bağlanır — sunucu
# onu ÜRETEMEZ, ilk açılıştan önce elle konur (README § İlk kurulum 1; yoksa api EROFS ile açılmaz).
#
# PORT YAYINI YOK: Docker yayınlanan portta ufw'yi atlar. Dışa yalnız Caddy (../proxy projesi, 80/443) açıktır;
# Caddy `adnan-ag` ağından `patron-api:4620`ye konuşur. DB yalnız `ic` (internal) ağda.
# Her kapsayıcı: root DEĞİL · kök FS salt okunur · bütün yetenekler düşük · no-new-privileges · bellek/pid tavanı.
#
# Tek seferlik göç + rol hizası ve tesis CLI'si (elle, önce yedek):
#   docker compose --profile goc run --rm goc
#   docker compose --profile goc run --rm goc node dist-cli/scripts/tesis.js <komut> …
# =============================================================================
name: patron

x-sertlik: &sertlik
  read_only: true
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    <<: *sertlik
    # Özetle sabit (çok mimarili dizin özeti, 2026-11-13); güncelleme = yeni özet + bakım penceresi.
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    container_name: patron-db
    restart: unless-stopped
    user: "70:70"
    # Sır dosyaları root:10001 0440: db yalnız kendine bağlanan iki sırrı (kök + göç parolası) bu grupla okur.
    group_add: ["10001"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_kok_parolasi
      TZ: Europe/Istanbul
      PGTZ: UTC
    secrets: [db_kok_parolasi, goc_parolasi]
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - timezone=UTC
    shm_size: 256m
    mem_limit: 1536m
    pids_limit: 200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:mode=1777
    networks: [ic]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *sertlik
    image: ${PATRON_IMAJ:?PATRON_IMAJ gerekli (adnan-patron:<sha>)}
    container_name: patron-api
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PATRON_ROL: sunucu
      NODE_ENV: production
      # Yığın cgroup tavanının altında: çöp toplayıcı OOM öldürmesinden ÖNCE devreye girer.
      NODE_OPTIONS: --max-old-space-size=320
      PORT: "4620"
      BIND: 0.0.0.0
      DB_ADI: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      # Cloudflare yok: Caddy (adnan-ag) iç vekildir; istemci adresi onun X-Forwarded-For son halkasından.
      IC_VEKIL_AGLARI: ${ADNAN_AG_ALT_AGI:?ADNAN_AG_ALT_AGI gerekli (adnan-ag alt ağı)}
      BILDIRIM_KIPI: kapali
    secrets: [uygulama_parolasi, esitleme_parolasi, tesis_rol_anahtari]
    volumes:
      - ./anahtarlar:/anahtarlar:ro
    tmpfs:
      - /tmp:mode=1777
    networks: [ic, adnan-ag]
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4620/saglik',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  goc:
    <<: *sertlik
    image: ${PATRON_IMAJ}
    profiles: ["goc"]
    restart: "no"
    user: "10001:10001"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PATRON_ROL: goc
      DB_ADI: ${POSTGRES_DB}
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node dist-cli/scripts/db-rolleri.js"]
    secrets: [goc_parolasi, uygulama_parolasi, esitleme_parolasi, tesis_rol_anahtari]
    volumes:
      - ./anahtarlar:/anahtarlar:ro
    tmpfs:
      - /tmp:mode=1777
    networks: [ic]
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 100

secrets:
  db_kok_parolasi:
    file: ./sirlar/db_kok_parolasi
  goc_parolasi:
    file: ./sirlar/goc_parolasi
  uygulama_parolasi:
    file: ./sirlar/uygulama_parolasi
  esitleme_parolasi:
    file: ./sirlar/esitleme_parolasi
  tesis_rol_anahtari:
    file: ./sirlar/tesis_rol_anahtari

volumes:
  pgdata:
networks:
  ic:
    internal: true
  adnan-ag:
    external: true
